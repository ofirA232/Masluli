# Render Blueprint: deploys the Vite build as a static site.
# Set the VITE_* values in the Render dashboard (they are public, browser-side keys).
services:
  - type: web
    name: planatrip
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
      - key: VITE_BOOKING_AID
        sync: false
      - key: VITE_GYG_PARTNER_ID
        sync: false
    routes:
      # Single-page app: every unknown path serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
